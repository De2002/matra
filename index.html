      // Ensure window.fetch, Window.prototype.fetch, and globalThis.fetch have a proper setter
      // preventing "TypeError: Cannot set property fetch of #<Window> which has only a getter"

        try {
          var initialFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = initialFetch;

          var fetchDescriptor = {
            get: function () {
              return currentFetch;
            },
            set: function (fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          };

          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', fetchDescriptor);
            } catch (_) {}
          }
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
            } catch (_) {}
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', fetchDescriptor);
            } catch (_) {}
          }
          if (typeof self !== 'undefined' && self !== window) {
            try {
              Object.defineProperty(self, 'fetch', fetchDescriptor);
            } catch (_) {}
          }
        } catch (_) {}
      })();
